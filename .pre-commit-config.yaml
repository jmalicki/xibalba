# Pre-commit hooks for Xibalba
# Install: pipx install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# All checks run through Bazel for hermeticity and consistency with CI

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Markdown link checking
  - repo: https://github.com/lycheeverse/lychee.git
    rev: v0.15.1
    hooks:
      - id: lychee
        name: Check markdown links
        # Accept 403/429 as valid (bot protection, not broken links)
        args: ['--verbose', '--no-progress', '--accept', '200,403,429']
        files: '\.md$'

  # Bazel-native linting (uses hermetic shellcheck from Bazel)
  - repo: local
    hooks:
      - id: bazel-shellcheck
        name: Shellcheck (via Bazel)
        entry: bazel test //tools:shellcheck_test --test_output=errors
        language: system
        files: '^vm/.*\.sh$'
        pass_filenames: false
        always_run: false
