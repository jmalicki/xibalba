# Pre-commit hooks for Xibalba
# Install: pipx install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# All checks run through Bazel for hermeticity and consistency with CI

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Bazel-native linting (uses hermetic shellcheck from Bazel)
  - repo: local
    hooks:
      - id: bazel-shellcheck
        name: Shellcheck (via Bazel)
        entry: bazel test //tools:shellcheck_test --test_output=errors
        language: system
        files: '^vm/.*\.sh$'
        pass_filenames: false
        always_run: false
