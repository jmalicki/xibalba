version: 1

sources:
  - channel: noble main
    url: https://snapshot.ubuntu.com/ubuntu/20241001T000000Z
  - channel: noble universe
    url: https://snapshot.ubuntu.com/ubuntu/20241001T000000Z

archs:
  - amd64

packages:
  # System essentials (for running commands in container)
  - bash
  - coreutils
  - findutils
  
  # Build dependencies (what CI needs to COMPILE Xibalba)
  - clang-18
  - libclang-cpp18
  - libllvm18
  - libedit2
  - libbpf-dev
  - libelf-dev
  - linux-headers-generic
  
  # Utilities (for CI scripts)
  - jq
  - libjq1
  - libonig5
  - curl
  - ca-certificates

# NOTE: Filesystem tools (mkfs.*, etc.) are NOT needed here!
# They are installed in QEMU VMs via initramfs (see vm/build-scripts/build-initramfs.sh)
# This container is ONLY for building Xibalba, not testing it.

