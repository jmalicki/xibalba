name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            llvm-18 \
            liburing-dev \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev
      
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      
      - name: Build release binaries
        run: bazel build --config=release //...
      
      - name: Package binaries
        run: |
          mkdir -p release/bin
          cp bazel-bin/chaos/chaos_rapid_modifications release/bin/
          cp bazel-bin/chaos/ebpf_injector_load release/bin/
          cp bazel-bin/chaos/ptrace_injector release/bin/
          cp bazel-bin/chaos/ultimate_stress_test release/bin/
          cp bazel-bin/chaos/ebpf_injector.bpf.o release/bin/
          
          mkdir -p release/scripts
          cp -r vms/*.sh release/scripts/
          cp -r helpers/*.sh release/scripts/
          
          tar czf rudra-${{ github.ref_name }}.tar.gz release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rudra-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true



