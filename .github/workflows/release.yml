name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            llvm-18 \
            liburing-dev \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev
      
      - name: Build release binaries
        run: |
          # Build C programs
          gcc -o simple_chaos_test chaos/simple_chaos_test.c common/dir_reader.c -I. -pthread
          gcc -o pause_controller chaos/pause_controller.c -lbpf -lelf
          
          # Build eBPF
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86_64 \
            -I/usr/include/x86_64-linux-gnu \
            -c chaos/pause_injector.bpf.c -o pause_injector.bpf.o
      
      - name: Package binaries
        run: |
          mkdir -p release/bin
          cp simple_chaos_test release/bin/
          cp pause_controller release/bin/
          cp pause_injector.bpf.o release/bin/
          
          mkdir -p release/scripts
          cp *.sh release/scripts/ || true
          
          mkdir -p release/docs
          cp -r docs/* release/docs/
          
          tar czf xibalba-${{ github.ref_name }}.tar.gz release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: xibalba-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true




