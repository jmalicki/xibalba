name: eBPF Build & Verify

on:
  push:
    branches: [main, develop]
    paths:
      - 'chaos/**/*.bpf.c'
      - 'chaos/**/BUILD.bazel'
  pull_request:
    paths:
      - 'chaos/**/*.bpf.c'

jobs:
  build-ebpf:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-$(uname -r) \
            bpftool
      
      - name: Compile eBPF program directly
        run: |
          # For now, compile directly with clang (Bazel eBPF support coming later)
          clang -g -O2 -target bpf \
            -D__TARGET_ARCH_x86_64 \
            -I/usr/include/x86_64-linux-gnu \
            -c chaos/pause_injector.bpf.c \
            -o pause_injector.bpf.o
          echo "✓ eBPF program compiled"
      
      - name: Verify eBPF program
        run: |
          llvm-objdump -h pause_injector.bpf.o
          size=$(stat -c%s pause_injector.bpf.o)
          echo "eBPF program size: $size bytes"
          if [ $size -gt 1000000 ]; then
            echo "⚠️  Warning: eBPF program is very large"
          fi
          echo "✓ eBPF verification complete"



