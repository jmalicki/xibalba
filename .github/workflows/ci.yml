name: RUDRA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Stage 1: Basic build and smoke tests
  build-and-test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v2
        continue-on-error: true  # Cache errors are non-fatal
      
      - name: Verify Bazel installation
        run: |
          if ! command -v bazel &> /dev/null; then
            echo "Bazel not found, installing manually..."
            wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
            chmod +x bazelisk-linux-amd64
            sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          fi
          bazel --version
      
      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev \
            linux-headers-$(uname -r)
      
      - name: Build all targets
        run: bazel build //...
      
      - name: Build Debian package
        run: bazel build //packaging:rudra-deb
      
      - name: Verify eBPF program
        run: |
          llvm-objdump -h bazel-bin/chaos/pause_injector.bpf.o
          size=$(stat -c%s bazel-bin/chaos/pause_injector.bpf.o)
          echo "✓ eBPF program size: $size bytes"
      
      - name: Verify Debian package
        run: |
          dpkg-deb --info bazel-bin/packaging/rudra_0.1.0_amd64.deb
          dpkg-deb --contents bazel-bin/packaging/rudra_0.1.0_amd64.deb
      
      - name: Run chaos test with validation (on stable kernel)
        run: |
          # Test on CI runner's filesystem (stable kernel)
          # Should find ZERO bugs (proves validation logic works)
          mkdir -p /tmp/xibalba_test
          
          echo "=== Running Xibalba chaos test with state tracking ==="
          echo "Testing on stable kernel - should find 0 bugs"
          echo ""
          
          # Run test (exits 0 if no bugs, 1 if bugs found)
          if bazel-bin/chaos/simple_chaos_test /tmp/xibalba_test; then
            echo ""
            echo "✅ SUCCESS: Validation works correctly (0 bugs on stable kernel)"
          else
            echo ""
            echo "⚠️  UNEXPECTED: Bugs found on stable kernel!"
            echo "This could indicate:"
            echo "  1. Actual race condition in kernel (unlikely on CI runner)"
            echo "  2. Bug in validation logic (needs investigation)"
            exit 1
          fi
      
      # Upload Debian package as primary artifact
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: rudra-deb-package
          path: bazel-bin/packaging/rudra_0.1.0_amd64.deb
          retention-days: 7
      
      # Also upload VM scripts for deployment
      - name: Upload VM scripts
        uses: actions/upload-artifact@v4
        with:
          name: rudra-vm-scripts
          path: |
            vm/*.sh
            bazel-bin/vm/
          retention-days: 1

  # Stage 2: VM Script Validation
  # 
  # IMPORTANT: GitHub-hosted runners CANNOT run VMs because:
  #   1. Xibalba tests CUSTOM KERNELS (the entire purpose!)
  #   2. VMs need nested virtualization (not available on GitHub runners)
  #   3. Containers share host kernel (can't test custom kernels)
  #   4. QEMU without KVM is 100x slower (not practical)
  #
  # Where to test VMs:
  #   - Locally (requires KVM) - bazel run //vm:create_vm
  #   - Self-hosted runner (with KVM enabled)
  #
  # This stage validates VM scripts are ready to use (syntax, package)
  # See docs/CI-AND-VM-TESTING.md for complete explanation
  validate-vm-scripts:
    name: Validate VM Scripts
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rudra-deb-package
          path: packages/
      
      - name: Verify package contents
        run: |
          echo "=== Debian package for VM deployment ==="
          dpkg-deb --info packages/rudra_0.1.0_amd64.deb
          dpkg-deb --contents packages/rudra_0.1.0_amd64.deb
          echo "✅ Package ready for VM deployment"
      
      - name: Validate VM script arguments
        run: |
          echo "=== Testing VM script argument parsing ==="
          # Test scripts accept --help without errors
          bash -n vm/create_test_vm.sh
          bash -n vm/deploy_rudra.sh
          bash -n vm/run_tests.sh
          bash -n vm/destroy_vm.sh
          echo "✅ All VM scripts are syntactically valid"
      
      - name: Document VM testing instructions
        run: |
          echo "=== VM Testing Instructions ==="
          echo ""
          echo "GitHub-hosted runners don't support KVM. To test VMs:"
          echo ""
          echo "Local testing (requires KVM):"
          echo "  bazel run //vm:create_vm -- --name test-01"
          echo "  bazel run //vm:deploy_rudra -- test-01"
          echo "  bazel run //vm:run_tests -- test-01"
          echo ""
          echo "Self-hosted runner:"
          echo "  Add 'runs-on: self-hosted' to workflow"
          echo "  Runner must have KVM enabled"
          echo ""


  # Linting (runs in parallel with build)
  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: '.git bazel-*'
          severity: warning
