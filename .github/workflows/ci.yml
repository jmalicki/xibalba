name: RUDRA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev
      
      - name: Compile DirectoryReader
        run: |
          gcc -c -o dir_reader.o common/dir_reader.c -I.
          echo "✓ DirectoryReader compiles"
      
      - name: Compile Simple Chaos Test
        run: |
          gcc -o simple_chaos_test chaos/simple_chaos_test.c common/dir_reader.c -I. -pthread
          echo "✓ Simple chaos test compiles"
      
      - name: Compile Pause Controller
        run: |
          gcc -o pause_controller chaos/pause_controller.c -lbpf -lelf
          echo "✓ Pause controller compiles"
      
      - name: Compile eBPF Program
        run: |
          clang -g -O2 -target bpf \
            -D__TARGET_ARCH_x86_64 \
            -I/usr/include/x86_64-linux-gnu \
            -c chaos/pause_injector.bpf.c \
            -o pause_injector.bpf.o
          echo "✓ eBPF program compiles"
      
      - name: Verify eBPF Program
        run: |
          llvm-objdump -h pause_injector.bpf.o
          size=$(stat -c%s pause_injector.bpf.o)
          echo "eBPF program size: $size bytes"
          echo "✓ eBPF program valid"
      
      - name: Test Simple Chaos (Smoke Test)
        run: |
          # Create test directory
          mkdir -p /tmp/rudra_test
          touch /tmp/rudra_test/file{1..50}
          
          # Run for 1 second (quick smoke test)
          timeout 2s ./simple_chaos_test /tmp/rudra_test || true
          echo "✓ Chaos test runs without crashing"

  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: '.git bazel-*'
          severity: warning
