name: RUDRA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Stage 1: Basic build and smoke tests
  build-and-test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v2
        continue-on-error: true  # Cache errors are non-fatal
      
      - name: Verify Bazel installation
        run: |
          if ! command -v bazel &> /dev/null; then
            echo "Bazel not found, installing manually..."
            wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
            chmod +x bazelisk-linux-amd64
            sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          fi
          bazel --version
      
      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            libelf-dev \
            linux-headers-$(uname -r)
      
      - name: Build all targets
        run: bazel build //...
      
      - name: Build Debian package
        run: bazel build //packaging:rudra-deb
      
      - name: Verify eBPF program
        run: |
          llvm-objdump -h bazel-bin/chaos/pause_injector.bpf.o
          size=$(stat -c%s bazel-bin/chaos/pause_injector.bpf.o)
          echo "✓ eBPF program size: $size bytes"
      
      - name: Verify Debian package
        run: |
          dpkg-deb --info bazel-bin/packaging/rudra_0.1.0_amd64.deb
          dpkg-deb --contents bazel-bin/packaging/rudra_0.1.0_amd64.deb
      
      - name: Run chaos test (smoke test)
        run: |
          mkdir -p /tmp/rudra_test
          touch /tmp/rudra_test/file{1..100}
          timeout 3s bazel-bin/chaos/simple_chaos_test /tmp/rudra_test || true
          echo "✓ Chaos test runs without crashing"
      
      # Upload Debian package as primary artifact
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: rudra-deb-package
          path: bazel-bin/packaging/rudra_0.1.0_amd64.deb
          retention-days: 7
      
      # Also upload VM scripts for deployment
      - name: Upload VM scripts
        uses: actions/upload-artifact@v4
        with:
          name: rudra-vm-scripts
          path: |
            vm/*.sh
            bazel-bin/vm/
          retention-days: 1

  # Stage 2a: Prepare VM infrastructure (once)
  # TODO: Move VM dependency management to Bazel for better caching
  # GitHub Actions matrix jobs run on separate runners, so apt packages
  # can't be shared directly. Future improvements:
  #   - Docker container with pre-installed VM deps
  #   - Bazel rules for VM management with hermetic caching
  prepare-vms:
    name: Prepare VM Infrastructure  
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache VM dependencies
        uses: actions/cache@v3
        id: vm-deps-cache
        with:
          path: |
            /var/cache/apt/archives/*.deb
          key: vm-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      
      - name: Install VM dependencies (once for all tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-kvm \
            libvirt-daemon-system \
            libvirt-clients \
            virtinst \
            bridge-utils
          echo "✅ VM infrastructure ready"
      
      - name: Verify KVM/libvirt
        run: |
          sudo systemctl start libvirtd || true
          virsh --version
          qemu-system-x86_64 --version

  # Stage 2b: Parallel VM tests across filesystems
  vm-tests:
    name: VM Test (${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    needs: prepare-vms
    
    strategy:
      fail-fast: false  # Continue other tests even if one fails
      matrix:
        filesystem: [ext4, xfs, btrfs, tmpfs]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Restore VM dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            /var/cache/apt/archives/*.deb
          key: vm-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      
      - name: Install VM dependencies (from cache)
        run: |
          sudo apt-get install -y \
            qemu-kvm \
            libvirt-daemon-system \
            libvirt-clients \
            virtinst \
            bridge-utils
      
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rudra-deb-package
          path: packages/
      
      - name: Download VM scripts
        uses: actions/download-artifact@v4
        with:
          name: rudra-vm-scripts
          path: .
      
      - name: Make scripts executable
        run: chmod +x vm/*.sh
      
      - name: Verify package
        run: |
          echo "=== Debian package downloaded ==="
          ls -lh packages/
          dpkg-deb --info packages/rudra_0.1.0_amd64.deb
      
      - name: Create test VM (${{ matrix.filesystem }})
        run: |
          # Use pre-built script directly (no rebuild)
          ./vm/create_test_vm.sh \
            --name ci-test-${{ matrix.filesystem }}-${{ github.run_id }} \
            --filesystem ${{ matrix.filesystem }} \
            --ram 2048 \
            --disk 8
        timeout-minutes: 15
      
      - name: Deploy RUDRA to VM (install .deb package)
        run: |
          # Install from Debian package (no rebuild!)
          # Copy package to VM and install
          VM_NAME="ci-test-${{ matrix.filesystem }}-${{ github.run_id }}"
          scp packages/rudra_0.1.0_amd64.deb root@$VM_NAME:/tmp/
          ssh root@$VM_NAME "dpkg -i /tmp/rudra_0.1.0_amd64.deb || apt-get install -f -y"
        timeout-minutes: 5
      
      - name: Run tests in VM
        run: |
          # Use pre-built script (no rebuild)
          ./vm/run_tests.sh ci-test-${{ matrix.filesystem }}-${{ github.run_id }} \
            > test-results-${{ matrix.filesystem }}.txt 2>&1
        timeout-minutes: 10
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.filesystem }}
          path: test-results-${{ matrix.filesystem }}.txt
          retention-days: 7
      
      - name: Cleanup VM
        if: always()
        run: |
          ./vm/destroy_vm.sh ci-test-${{ matrix.filesystem }}-${{ github.run_id }} || true

  # Stage 3: Collect and report results
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: vm-tests
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: results/
      
      - name: Display results summary
        run: |
          echo "=== RUDRA Test Results ==="
          echo
          for fs in ext4 xfs btrfs tmpfs; do
            echo "## $fs filesystem:"
            if [ -f "results/test-results-$fs/test-results-$fs.txt" ]; then
              tail -20 "results/test-results-$fs/test-results-$fs.txt"
            else
              echo "  ❌ No results found"
            fi
            echo
          done

  # Linting (runs in parallel with build)
  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: '.git bazel-*'
          severity: warning
