name: RUDRA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        config:
          - name: Default (UBSan)
            bazel_config: ""
          - name: ASan
            bazel_config: "asan"
          - name: TSan (Race Detection)
            bazel_config: "tsan"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            llvm-18 \
            liburing-dev \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev
      
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ matrix.config.name }}-${{ hashFiles('WORKSPACE', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.config.name }}-
            bazel-${{ runner.os }}-
      
      - name: Build all targets (${{ matrix.config.name }})
        run: |
          if [ -n "${{ matrix.config.bazel_config }}" ]; then
            bazel build --config=${{ matrix.config.bazel_config }} //...
          else
            bazel build //...
          fi
      
      - name: Run tests (${{ matrix.config.name }})
        run: |
          if [ -n "${{ matrix.config.bazel_config }}" ]; then
            bazel test --config=${{ matrix.config.bazel_config }} --test_output=errors //...
          else
            bazel test --test_output=errors //...
          fi
  
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18
      
      - name: Run clang-tidy
        run: |
          find common chaos -name '*.c' -o -name '*.h' | \
            xargs clang-tidy-18 --config-file=.clang-tidy
  
  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './vms'
          additional_files: './helpers'
  
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pre-commit
        run: pip install pre-commit
      
      - name: Run pre-commit
        run: pre-commit run --all-files
  
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            llvm-18 \
            liburing-dev \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev \
            lcov
      
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      
      - name: Run tests with coverage
        run: bazel coverage //...
      
      - name: Generate coverage report
        run: |
          genhtml -o coverage bazel-out/_coverage/_coverage_report.dat
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./bazel-out/_coverage/_coverage_report.dat
          flags: unittests
          name: rudra-coverage
